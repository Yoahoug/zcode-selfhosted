name: selfhost-release

on:
  push:
    tags:
      - "selfhost-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version override (e.g. 3.14.3-selfhost.1)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Bootstrap
        run: pnpm bootstrap
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Architecture check
        run: pnpm architecture:check
      - name: Build zcode distribution
        run: |
          VERSION="${{ inputs.version }}"
          if [[ "${GITHUB_REF}" == refs/tags/selfhost-v* ]]; then
            VERSION="${VERSION:-${GITHUB_REF#refs/tags/selfhost-v}}"
          fi
          # base-url 必须指向本次发布的 tag 名，而不是浮动的 selfhost-latest，
          # 否则同版本重发或 latest 指向漂移后，latest.json 与 tar.gz 会错位 404。
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            DIST_TAG="${{ github.ref_name }}"
          else
            DIST_TAG="selfhost-latest"
          fi
          ARGS=(--base-url "https://github.com/${{ github.repository }}/releases/download/${DIST_TAG}/")
          if [[ -n "$VERSION" ]]; then
            ARGS+=(--version "$VERSION")
          fi
          pnpm build:zcode "${ARGS[@]}"
      - name: Collect artifacts
        run: |
          ls -R dist/zcode/releases
          cp dist/zcode/install.sh ./install.sh
          cp dist/zcode/latest.json ./latest.json
          # GitHub Release 的资产是扁平的，没有 releases/<version>/ 目录层级；
          # 上游 install.sh 按 `${BASE_URL}/releases/$VERSION/$TARBALL` 拼 URL，
          # 在我们的扁平布局下会 404。这里只改下载路径拼接，sha256.txt 与 install.sh
          # 一起发布，服务器安装后可用 sha256.txt 做离线校验。
          sed -i 's|\${BASE_URL%/}/releases/$VERSION/$TARBALL|${BASE_URL%/}/$TARBALL|' ./install.sh
          echo "flattened install.sh download line:"
          grep -n "curl -fL" ./install.sh
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'selfhost-latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'selfhost-latest' }}
          prerelease: true
          files: |
            dist/zcode/releases/*/*.tar.gz
            dist/zcode/releases/*/sha256.txt
            install.sh
            latest.json
